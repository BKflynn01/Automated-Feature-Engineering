[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = 'py311'

[tool.ruff.lint]
ignore = ['E203', 'E501']

[tool.isort]
profile = 'black'
line_length = 100
known_first_party = ["ga_optimizer"]

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-v --cov=ga_optimizer --cov-report=term-missing'

[tool.mypy]
python_version = '3.11'
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
