[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "wandb", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["test"]
addopts = "-v --cov=ga_optimizer --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = '(^|/)(\.venv|wandb|__pycache__)(/|$)'
files = ["test", "main.py", "ga_optimizer", "utilis.py"]

[tool.bandit]
exclude_dirs = [".venv", "wandb", "__pycache__"]
skips = ["B101", "B105", "B110", "B112", "B113", "B311", "B404", "B603", "B607", "B615", "B102"]