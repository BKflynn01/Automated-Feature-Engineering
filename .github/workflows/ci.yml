name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: requirements-ci.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
        pip install "numpy>=1.24.0" "scikit-learn>=1.3.0" "xgboost>=2.0.0" "deap>=1.4.1" pip-audit

    - name: Lint with Ruff
      run: ruff check ga_optimizer/

    - name: Lint GA module with Ruff
      run: ruff check ga_optimizer/ga/

    - name: Check formatting with Black
      run: black --check ga_optimizer/

    - name: Type-check with mypy
      run: mypy ga_optimizer/

    - name: Type-check GA module with mypy
      run: mypy ga_optimizer/ga/ --ignore-missing-imports

    - name: Security scan with Bandit
      run: bandit -c bandit.yaml -r ga_optimizer/

    - name: Security scan GA module with Bandit
      run: bandit -r ga_optimizer/ga/ -ll

    - name: Dependency audit with pip-audit
      run: pip-audit

    - name: Run tests with coverage
      run: PYTHONPATH=. pytest --cov-report=term-missing --cov-report=html

    - name: GA smoke test
      run: |
        python - <<'PY'
        import os
        import tempfile
        import pandas as pd
        from sklearn.datasets import make_classification
        from ga_optimizer.ga.runner import run_ga

        X, y = make_classification(
            n_samples=50,
            n_features=5,
            n_informative=3,
            random_state=42,
        )
        df = pd.DataFrame(X, columns=[f"f{i}" for i in range(5)])
        df["target"] = y

        with tempfile.TemporaryDirectory() as tmp_dir:
            csv_path = os.path.join(tmp_dir, "tiny.csv")
            out_dir = os.path.join(tmp_dir, "out")
            df.to_csv(csv_path, index=False)
            run_ga(
                csv_path=csv_path,
                label_column="target",
                task="classification",
                scoring="accuracy",
                output_dir=out_dir,
                n_generations=2,
                population_size=10,
                cv_folds=2,
                n_estimators=10,
                random_state=42,
            )
        PY

    - name: Upload coverage report
      uses: actions/upload-artifact@v5
      with:
        name: coverage-report
        path: htmlcov/
