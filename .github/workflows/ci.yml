name: CI
on: [push, pull_request]

jobs:
  quality-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: requirements-ci.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
        pip install pip-audit pytest-cov

    - name: Static Analysis (Lint & Format)
      run: |
        black --check ga_optimizer/
        ruff check ga_optimizer/

    - name: Type Check
      run: mypy ga_optimizer/

    - name: Security & Audit
      run: |
        bandit -c bandit.yaml -r ga_optimizer/
        pip-audit --ignore-vuln CVE-2026-4539

    - name: Run Tests & Coverage
      run: |
        PYTHONPATH=. pytest --cov=ga_optimizer --cov-report=term-missing --cov-report=html

    - name: Upload Coverage Report
    # Upload even if tests fail 
      if: always() 
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/